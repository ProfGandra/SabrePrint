; Sabre 3D - teste inicial ESP32-S3 CAM N16R8
; Perfil generico ESP32-S3; confirmar placa e memoria antes de testes avancados.
[platformio]
default_envs = esp32s3_cam_diag

[env:esp32s3_cam_diag]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
    -D SABRE3D_VERSION=\"0.2.0-diag\"
